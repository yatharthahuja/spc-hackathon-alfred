skills:
  listen:
    type: digital
    description: Capture audio from microphone.
    inputs: []
    outputs: [audio_file]
    enabled: true

  speech_to_text:
    type: digital
    description: Convert user speech to text using ElevenLabs.
    inputs: [audio_file]
    outputs: [text]
    enabled: true

  capture_wrist_camera_image:
    type: physical
    description: Capture an image from the wrist camera.
    inputs: [camera_id]
    outputs: [image_path]
    enabled: true

  describe_image_with_vlm:
    type: vision
    description: Describe objects and scene in an image.
    inputs: [image_path, question]
    outputs: [objects, uncertainties, spoken_summary]
    enabled: true

  speak:
    type: digital
    description: Speak text to the user using ElevenLabs TTS.
    inputs: [text]
    outputs: [audio_path, audio_played]
    enabled: true

  answer_task_history:
    type: digital
    description: Answer questions about prior user questions, tasks, completion status, and skill results from this server session.
    inputs: [question, limit]
    outputs: [answer_text, task_count, selected_task_count, raw_response]
    examples:
      - what tasks have you done so far?
      - what have you done?
      - tell me all tasks
      - what was the last task?
      - tell me the last 2 tasks
      - what did you just do?
    enabled: true

  general_conversation:
    type: digital
    description: Friendly general conversation and open-ended Q&A when no more specific robot, vision, or history skill is requested.
    inputs: [question]
    outputs: [answer_text, confidence, raw_response]
    examples:
      - hi Alfred
      - how are you today?
      - what is your name?
      - what skills do you have?
      - what is the capital of the USA?
      - tell me a joke
    enabled: true

  move_arm_noop:
    type: physical
    description: Placeholder arm motion skill that never moves hardware.
    inputs: [pose_name]
    outputs: [pose_name, moved]
    enabled: true

  go_home:
    type: physical
    description: Move the robot arm to the saved go_home pose and stop there.
    inputs: []
    outputs: [trajectory_names, robot_move_attempted, robot_moved, message]
    trajectory_names: [go_home]
    examples:
      - go home
      - return home
      - move home
      - go to home pose
    enabled: true

  go_overlook:
    type: physical
    description: Move the robot arm to the saved overlook pose and stop there.
    inputs: []
    outputs: [trajectory_names, robot_move_attempted, robot_moved, message]
    trajectory_names: [overlook]
    examples:
      - go overlook
      - go to overlook
      - move to overlook
      - look at the table
      - go to the overlook pose
    enabled: true

  pick_blue_marker:
    type: physical
    description: Pick up the blue marker from the table and hold it. If the user says marker without a color, treat it as the blue marker.
    inputs: []
    outputs: [trajectory_names, robot_move_attempted, robot_moved, message]
    trajectory_names: [pre_pick_marker, pick_marker, post_pick_marker]
    examples:
      - pick blue marker
      - pick this blue marker
      - pick the blue marker
      - pick up the blue marker
      - pick the marker
      - grab marker
    enabled: true

  pick_place_blue_marker:
    type: physical
    description: Pick up the blue marker and place or drop it at the placement zone. If the user says marker, Sharpie, or sharpy without a color, treat it as the blue marker. Also use this to remove the marker or clean up the table.
    inputs: []
    outputs: [trajectory_names, robot_move_attempted, robot_moved, message]
    trajectory_names: [pre_pick_marker, pick_marker, post_pick_marker, pre_place, drop_marker]
    examples:
      - pick and place the blue marker
      - pick place blue marker
      - pick up and drop the blue marker
      - move the blue marker to the place location
      - pick and place the marker
      - drop the marker
      - pick the sharpie
      - pick the sharpy
      - remove the marker from the table
      - remove the sharpie from the table
      - clean up the table
    enabled: true

  enzyme_experiments:
    type: physical
    description: Run the full scripted enzyme or biological experiment trajectory using the test-tube grasp, pour, drop, and home poses.
    inputs: []
    outputs: [trajectory_names, robot_move_attempted, robot_moved, message]
    trajectory_names: [test_tube_pre_grasp, test_tube_grasp, test_tube_pick_pose, test_tube_pick_pose_2, test_tube_pre_pour, test_tube_mid_pour, test_tube_about_to_pour, test_tube_pour, test_tube_pour_continued, test_tube_pour_complete, test_tube_post_pour, test_tube_post_post_pour, test_tube_pre_drop, test_tube_about_to_drop, test_tube_drop, test_tube_finish, test_tube_pour_home]
    examples:
      - do enzyme experiments
      - do the enzyme experiment
      - run enzyme experiments
      - do the biological experiments
      - run the biological experiment
      - perform the test tube experiment
    enabled: true

  ordering:
    type: digital
    description: Signal the external ordering system by writing 1 to /home/asjad/hackathon/drone/run when the user asks Alfred to buy, order, purchase, or get items for them.
    inputs: [user_text]
    outputs: [signal_file, signal_value, previous_value, user_text, message]
    examples:
      - can you please get something for me
      - can you please get apple and oranges for me
      - buy something for me
      - order something for me
      - please order apples and oranges
      - purchase groceries for me
    enabled: true

  answer_scene_question:
    type: vision
    description: Move to the overlook pose, capture a wrist-camera image, and answer a user question about the visible scene.
    inputs: [question]
    outputs: [image_path, answer_text, confidence, raw_response]
    examples:
      - what color is the marker?
      - what color is the pen?
      - how many markers are there?
      - is there a cup on the table?
      - do you see a blue marker?
    enabled: true

  read_notes:
    type: vision
    description: Move to the overlook pose, capture a wrist-camera image, read visible handwritten or printed notes, and tell the user what text is written.
    inputs: [user_text]
    outputs: [image_path, extracted_text, answer_text, confidence, raw_response]
    examples:
      - read my notes
      - what do my notes say?
      - read the note
      - what text is written on the paper?
      - tell me what is written in my notes
    enabled: true

  amazon_search:
    type: digital
    description: Search Amazon for a product and return the top organic result with price, rating, and key features.
    inputs: [query, max_price]
    outputs: [asin, title, price_text, price, rating, reviews, feature_summary, thumbnail_url, product_url, answer_text]
    examples:
      - find me organic apples on amazon
      - search amazon for sony headphones
      - look up a usb-c hub
      - what's the best blender on amazon
      - find organic coffee under twenty dollars
      - I need to order milk on amazon
      - search for an air fryer
      - buy paper towels
      - find a phone charger on amazon
      - look up bluetooth speakers under fifty bucks
      - order me some dish soap
      - shop for running shoes
      - find lego sets for kids
      - what's a good standing desk on amazon
      - amazon search wireless mouse
    enabled: true

  amazon_add_to_cart:
    type: digital
    description: Add the most recently searched Amazon product to the user's cart. Opens a browser tab for the user to confirm. Only run AFTER amazon_search in a separate turn — never in the same plan.
    inputs: [quantity]
    outputs: [cart_url, asin, quantity, browser_opened, title, answer_text]
    examples:
      - yes add it to my cart
      - yeah go ahead
      - add it
      - add to cart
      - yep buy it
      - sounds good add it
      - confirm add to cart
      - yes just one
      - add two of those
      - put it in the cart
    enabled: true
