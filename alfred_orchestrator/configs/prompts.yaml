    User request: "what's on my desk and go home"
    JSON: {{"skill_calls": [{{"skill_name": "answer_scene_question", "arguments": {{"question": "what's on my desk"}}, "confidence": 0.9, "reason": "First answer a visual question about the desk."}}, {{"skill_name": "go_home", "arguments": {{}}, "confidence": 0.95, "reason": "Then move to the home pose."}}], "confidence": 0.9, "reason": "The user requested visual Q&A followed by a robot motion."}}

    User request: "pick and place the marker and go home"
    JSON: {{"skill_calls": [{{"skill_name": "pick_place_blue_marker", "arguments": {{}}, "confidence": 0.95, "reason": "First pick and place the marker; marker defaults to blue."}}, {{"skill_name": "go_home", "arguments": {{}}, "confidence": 0.95, "reason": "Then move to the home pose."}}], "confidence": 0.95, "reason": "The user requested marker pick-place followed by home pose."}}

    User request: "do enzyme experiments"
    JSON: {{"skill_calls": [{{"skill_name": "enzyme_experiments", "arguments": {{}}, "confidence": 0.95, "reason": "The user asked Alfred to run the scripted enzyme experiment trajectory."}}], "confidence": 0.95, "reason": "The user requested the enzyme experiment skill."}}

    User request: "do the biological experiments"
